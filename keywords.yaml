# GWM LatAm News Monitor v2 - Keywords Configuration

blacklist:
  # Motorcycles (exclude)
  - "motocicleta"
  - "moto"
  - "motocross"
  - "scooter"
  
  # Crime and violence (exclude)
  - "crimen"
  - "homicidio"
  - "asesinato"
  - "narcotráfico"
  - "secuestro"
  - "extorsión"
  - "pandilla"
  - "bomba"
  - "terrorismo"
  - "violencia"
  
  # Geo-political conflicts (exclude)
  - "Oriente Medio"
  - "Middle East"
  - "Ucrania"
  - "Ukraine"
  - "Gaza"
  - "Israel"
  - "Palestina"
  
  # Irrelevant topics
  - "farándula"
  - "celebridad"
  - "fútbol"
  - "deporte"

